name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: '0.5.9'
          sha256: '2fee13923018dd517c19dba032ddcae8010cadfb81bc47e742ad5e8981a3f126'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Tectonic bundle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('Tectonic.toml', '**/*.tex') }}
          restore-keys: tectonic-${{ runner.os }}-

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('setup.sh') }}

      - name: Install tools and build
        run: |
          ./setup.sh --bin-dir "$PWD/tools"
          ./tools/tectonic -X build

      - name: Upload PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: build/default/default.pdf
          if-no-files-found: error
          archive: false
