default_install_hook_types:
  - pre-commit
  - pre-push

default_stages:
  - pre-commit

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/jolars/badness-pre-commit
    rev: v0.26.0
    hooks:
      - id: badness-lint
      - id: badness-format
        args: [--check]

  - repo: local
    hooks:
      - id: tectonic-build
        name: tectonic build
        entry: tectonic -X build
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
